name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f4ffd3f7c8d6a1b11a1a4ca7e563ac949e3ee4a1 # v3
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@f4ffd3f7c8d6a1b11a1a4ca7e563ac949e3ee4a1 # v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f4ffd3f7c8d6a1b11a1a4ca7e563ac949e3ee4a1 # v3